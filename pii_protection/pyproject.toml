[project]
name = "pii-protection"
version = "0.1.0"
description = "Reversible protection of customer emails: HMAC pseudonym plus encryption."
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_protection"]
